name: caenis
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: caenis_overseer
      POSTGRES_USER: caenis_owner
      POSTGRES_PASSWORD: ${DATABASE_OWNER_PASSWORD:?Run scripts/Initialize-Caenis.ps1}
      CAENIS_DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Database password required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/01-runtime-user.sh:/docker-entrypoint-initdb.d/01-runtime-user.sh:ro
    restart: unless-stopped
    networks: [data]
  core:
    build:
      context: .
      dockerfile: backend-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/caenis_overseer
      DATABASE_USER: caenis
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Database password required}
      SPRING_FLYWAY_USER: caenis_owner
      SPRING_FLYWAY_PASSWORD: ${DATABASE_OWNER_PASSWORD:?Database owner password required}
      CAENIS_PUBLIC_ORIGIN: ${CAENIS_PUBLIC_ORIGIN:-http://localhost:3000}
      CAENIS_SECURE_COOKIES: ${CAENIS_SECURE_COOKIES:-true}
      CAENIS_SESSION_SECRET: ${CAENIS_SESSION_SECRET:?Session secret required}
      CAENIS_ENCRYPTION_KEY: ${CAENIS_ENCRYPTION_KEY:?Encryption key required}
      CAENIS_ADMIN_USERNAME: ${CAENIS_ADMIN_USERNAME:-admin}
      CAENIS_ADMIN_PASSWORD: ${CAENIS_ADMIN_PASSWORD:?Administrator password required}
    depends_on: [postgres]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    networks: [data,app]
  web:
    build:
      context: ./caenis-web
      args:
        CAENIS_BACKEND_URL: http://core:8080
    environment:
      CAENIS_BACKEND_URL: http://core:8080
      CAENIS_SESSION_SECRET: ${CAENIS_SESSION_SECRET:?Session secret required}
    depends_on: [core]
    restart: unless-stopped
    networks: [app]
  gateway:
    image: traefik:v3.4
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --api.dashboard=false
      - --log.level=WARN
    ports:
      - "${CAENIS_BIND:-127.0.0.1}:${CAENIS_HTTP_PORT:-3000}:80"
    volumes:
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on: [web,core]
    restart: unless-stopped
    networks: [app]
volumes:
  postgres-data:
networks:
  data:
    internal: true
  app:
