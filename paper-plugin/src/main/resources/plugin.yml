name: CaenisOverseer
version: '${version}'
main: com.sideplanetary.overseerPlugin.OverseerPlugin
api-version: '1.21.11'
load: POSTWORLD
description: "Asynchronous mining telemetry and authenticated fleet monitoring"
commands:
  caenis:
    description: "Console-only temporary player containment"
    usage: "/caenis <freeze|unfreeze> <uuid>"
    permission: caenis.console
permissions:
  caenis.console:
    default: op
